<section class="container">
    <div>
        <h2 *ngIf="mostrar_nombre; else elseBlock">{{ nombre }}</h2>
        <ng-template #elseBlock>
            <h2>Oculto</h2>
        </ng-template>

        <button
            class="btn"
            (click)="mostrarNombre()"
            >Click
        </button>
    </div>

    @for (book of books; track book.id) {
        <article class="book-card">
            <div class="book-card__cover">
                <img [src]="book.coverUrl" [alt]="'Portada del libro ' + book.title" loading="lazy" />
            </div>
            <div class="book-card__info">
                <div>
                    <h3 class="book-card__title">{{ book.title }}</h3>
                    <p class="book-card__author">{{ book.author }}</p>
                    <p class="book-card__pages">{{ book.pages }} páginas</p>
                </div>
                <div class="book-card__actions">
                    @for (action of bookActions; track action.type) {
                        <button 
                            type="button" 
                            class="book-card__button book-card__button--{{ action.type }}"
                            [attr.aria-label]="action.label"
                            [title]="action.label">

                            @switch (action.type) {
                                @case ('favorite') {
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"/></svg>
                                }
                                @case ('read') {
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M18 6 7 17l-5-5"/><path d="m22 10-7.5 7.5L13 16"/></svg>
                                }
                                @case ('read-later') {
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                                }
                                @default {
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/></svg>
                                }
                            }
                        </button>
                    }
                </div>
            </div>
        </article>
    }
</section>
